<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unidos — Gastos y mesas de boda</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#6E3B3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Unidos">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --rose:#52664A;
    --rose-soft:#DEE5D8;
    --indigo:#6E3B3F;
    --indigo-soft:#E9DBDA;
    --gold:#B0872E;
    --gold-soft:#F0E4C7;
    --sage:#5E7D86;
    --sage-soft:#DBE5E7;
    --paper:#EEECE0;
    --card:#F8F6EF;
    --ink:#262420;
    --ink-dim:#948C78;
    --line:#DED8C6;
    --danger:#B03B2E;
    --radius:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:ui-serif,Georgia,"Times New Roman",serif;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:86px;
  }
  header.top{
    padding:22px 20px 14px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
  }
  header.top .title{
    font-family:ui-serif,Georgia,serif;
    font-size:26px;
    font-weight:600;
    letter-spacing:.2px;
  }
  header.top .title .knot{color:var(--rose);}
  header.top .sub{font-size:13px;color:var(--ink-dim);margin-top:2px;}
  .gear{
    width:38px;height:38px;border-radius:50%;
    background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .gear svg{width:18px;height:18px;stroke:var(--ink-dim);}

  main{flex:1;padding:0 20px;}

  /* ---------- Hero donut ---------- */
  .hero{
    background:var(--card);
    border-radius:var(--radius);
    padding:22px 20px 20px;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:16px;
  }
  .hero .ring-wrap{position:relative;width:112px;height:112px;flex-shrink:0;}
  .hero .ring-wrap svg{width:100%;height:100%;}
  .hero .ring-center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
  }
  .hero .ring-center .lbl{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);}
  .hero .ring-center .amt{font-size:15px;font-weight:700;margin-top:1px;}
  .hero .legend{flex:1;}
  .hero .legend-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:7px;}
  .hero .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .hero .legend-row .name{color:var(--ink-dim);flex:1;}
  .hero .legend-row .val{font-weight:700;}
  .hero .diff{
    margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
    font-size:12px;color:var(--ink-dim);line-height:1.4;
  }

  /* ---------- section headers ---------- */
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:22px 0 10px;
  }
  .section-head h2{font-family:ui-serif,Georgia,serif;font-size:17px;margin:0;font-weight:600;}
  .section-head a.link{font-size:12.5px;color:var(--indigo);cursor:pointer;text-decoration:none;font-weight:600;}

  /* ---------- objetivo cards ---------- */
  .obj-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    cursor:pointer;
    transition:transform .1s ease;
  }
  .obj-card:active{transform:scale(.99);}
  .obj-top{display:flex;align-items:center;gap:12px;}
  .obj-icon{
    width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
  }
  .obj-name{font-weight:700;font-size:15px;}
  .obj-cat-count{font-size:12px;color:var(--ink-dim);margin-top:1px;}
  .obj-total{margin-left:auto;text-align:right;}
  .obj-total .amt{font-weight:700;font-size:15px;}
  .obj-total .meta{font-size:11px;color:var(--ink-dim);}
  .obj-bar-track{height:6px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden;}
  .obj-bar-fill{height:100%;border-radius:4px;background:var(--gold);}
  .obj-split{display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:12px;background:var(--line);}

  .sub-list{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .sub-row{margin-bottom:9px;}
  .sub-row:last-child{margin-bottom:0;}
  .sub-row-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .sub-row-top span:first-child{color:var(--ink);}
  .sub-row-top .num{font-weight:700;}
  .sub-check{
    display:inline-flex;align-items:center;justify-content:center;
    width:15px;height:15px;border-radius:50%;background:var(--rose);color:#fff;
    font-size:9.5px;font-weight:800;line-height:1;margin-right:2px;position:relative;top:-1px;
  }
  .sub-row-track{height:4px;background:var(--line);border-radius:3px;overflow:hidden;}
  .sub-row-fill{height:100%;border-radius:3px;opacity:.55;}
  .sub-row-warn{font-size:11px;color:var(--danger);font-weight:600;margin-top:4px;}
  .sub-empty{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-dim);}

  .empty{
    text-align:center;padding:34px 16px;color:var(--ink-dim);font-size:13.5px;
    border:1px dashed var(--line);border-radius:var(--radius);line-height:1.6;
  }

  /* ---------- gasto list ---------- */
  .filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
  .filters select, .filters input{
    border:1px solid var(--line);background:var(--card);border-radius:99px;
    padding:8px 12px;font-size:12.5px;color:var(--ink);flex-shrink:0;
  }
  .gasto-row{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;
  }
  .gasto-tag{
    width:6px;align-self:stretch;border-radius:4px;flex-shrink:0;
  }
  .gasto-mid{flex:1;min-width:0;}
  .gasto-cat{font-weight:700;font-size:13.5px;}
  .gasto-desc{font-size:12px;color:var(--ink-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gasto-meta{font-size:11px;color:var(--ink-dim);margin-top:3px;display:flex;gap:6px;align-items:center;}
  .who-chip{
    font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;
  }
  .gasto-right{text-align:right;flex-shrink:0;}
  .gasto-amt{font-weight:700;font-size:14.5px;}
  .gasto-del{
    background:none;border:none;color:var(--ink-dim);font-size:11px;
    margin-top:4px;cursor:pointer;padding:0;
  }

  /* ---------- mesas ---------- */
  .plano-wrap{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 10px;position:relative;
  }
  .pz-frame{
    position:relative;overflow:hidden;border-radius:12px;
    touch-action:none;background:var(--card);
  }
  .pz-inner{
    width:100%;height:100%;
  }
  .pz-inner svg{width:100%;height:100%;display:block;}
  .pz-hint{
    text-align:center;font-size:10.5px;color:var(--ink-dim);margin-top:8px;
  }
  .mesa-svg-wrap{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px;margin-top:14px;position:relative;
  }
  .fs-btn{
    position:absolute;top:12px;right:12px;z-index:2;
    width:32px;height:32px;border-radius:50%;
    background:var(--paper);border:1px solid var(--line);font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .mesa-tabla-wrap{margin-top:20px;}
  .mesa-tabla{
    width:100%;border-collapse:collapse;background:var(--card);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px;
  }
  .mesa-tabla th, .mesa-tabla td{
    padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;
  }
  .mesa-tabla th{background:var(--paper);font-weight:700;color:var(--ink-dim);font-size:12px;}
  .mesa-tabla td.num, .mesa-tabla th.num{text-align:center;font-weight:600;}
  .mesa-tabla tbody tr:last-child td{border-bottom:1px solid var(--line);}
  .mesa-tabla tfoot td{font-weight:800;background:var(--paper);border-bottom:none;}
  .mesa-tabla-completa td{background:var(--rose-soft);color:var(--rose);font-weight:700;}

  /* ---------- luna de miel ---------- */
  .luna-timeline{display:flex;flex-direction:column;}
  .luna-parada{display:flex;gap:12px;}
  .luna-linea{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:28px;}
  .luna-punto{
    width:28px;height:28px;border-radius:50%;background:var(--indigo);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;
  }
  .luna-conector{flex:1;width:2px;background:var(--line);margin:2px 0;min-height:24px;}
  .luna-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:14px;margin-bottom:16px;flex:1;cursor:pointer;
  }
  .luna-card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
  .luna-ciudad{font-weight:800;font-size:15px;}
  .luna-noches{font-size:11.5px;color:var(--ink-dim);}
  .luna-fila{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:6px;color:var(--ink);}
  .luna-notas{font-size:12px;color:var(--ink-dim);font-style:italic;margin:4px 0;}
  .luna-actcount{font-size:11px;color:var(--ink-dim);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .luna-chip{
    font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;flex-shrink:0;white-space:nowrap;
  }
  .luna-chip-ok{background:var(--rose-soft);color:var(--rose);}
  .luna-chip-pend{background:var(--gold-soft);color:var(--gold);}

  .luna-dia-grupo{margin-bottom:18px;}
  .luna-dia-header{
    font-family:ui-serif,Georgia,serif;font-size:14.5px;font-weight:700;
    margin-bottom:8px;text-transform:capitalize;
  }
  .luna-act-row{
    display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 14px;margin-bottom:8px;cursor:pointer;
  }
  .luna-act-hora{font-weight:700;font-size:12px;color:var(--indigo);white-space:nowrap;margin-bottom:3px;}
  .luna-act-mid{flex:1;min-width:0;}
  .luna-act-titulo{font-weight:700;font-size:13px;}
  .luna-act-ciudad{font-size:11.5px;color:var(--ink-dim);margin-top:1px;}
  .luna-act-hecho{opacity:.6;}
  .luna-act-hecho .luna-act-titulo{text-decoration:line-through;}

  .luna-escala{
    background:var(--gold-soft);border:1px dashed var(--gold);border-radius:14px;
    padding:12px 14px;margin:-8px 0 16px;font-size:12.5px;
  }
  .luna-escala-head{font-weight:700;color:var(--ink);margin-bottom:8px;}
  .luna-escala-check{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;}
  .luna-escala-check:last-of-type{margin-bottom:0;}
  .luna-escala-notas{
    width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:12.5px;background:var(--card);
  }
  .luna-escala-ajustada{font-weight:600;color:var(--ink-dim);margin:-8px 0 16px;}

  .luna-hotel-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:9px;cursor:pointer;
  }
  .luna-hotel-row > div[data-puntoopen]{flex:1;min-width:0;}
  .luna-hotel-ciudad{font-weight:700;font-size:13px;}
  .luna-hotel-nombre{font-size:11.5px;color:var(--ink-dim);margin-top:1px;}
  .luna-gmaps-btn{
    flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--paper);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:14px;text-decoration:none;
  }

  .luna-mapa-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative;}
  #lunaMapa{height:380px;width:100%;background:var(--line);}

  .cal-wrap{
    --cal-scale:1; overflow:auto; border:1px solid var(--line); border-radius:12px;
    -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y;
  }
  .cal-wrap-fs{flex:1; border-radius:0; border:none; border-top:1px solid var(--line);}
  .cal-tabla{border-collapse:collapse; font-size:calc(11px * var(--cal-scale)); width:100%;}
  .cal-tabla th, .cal-tabla td{border:1px solid var(--line);padding:0;text-align:center;}
  .cal-tabla th{
    background:var(--paper);color:var(--ink);font-weight:700;
    padding:calc(8px * var(--cal-scale)) calc(10px * var(--cal-scale));
    white-space:nowrap;position:sticky;top:0;z-index:1;
  }
  .cal-esquina{position:sticky;left:0;top:0;z-index:2;background:var(--paper);}
  .cal-hora{
    background:var(--paper);color:var(--ink-dim);font-weight:600;font-size:calc(10.5px * var(--cal-scale));
    padding:calc(6px * var(--cal-scale)) calc(10px * var(--cal-scale));white-space:nowrap;position:sticky;left:0;
  }
  .cal-vacio{height:calc(28px * var(--cal-scale));min-width:calc(76px * var(--cal-scale));}
  .cal-evento{
    min-width:calc(76px * var(--cal-scale));padding:calc(4px * var(--cal-scale)) calc(6px * var(--cal-scale));
    vertical-align:middle;
  }
  .cal-ev-label{font-size:calc(10px * var(--cal-scale));font-weight:700;line-height:1.25;padding:2px 0;}
  .cal-ev-vuelo{background:var(--indigo-soft);}
  .cal-ev-vuelo .cal-ev-label{color:var(--indigo);}
  .cal-ev-actividad{background:var(--gold-soft);}
  .cal-ev-actividad .cal-ev-label{color:var(--gold);}
  .cal-legend-dot{
    display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 4px 0 10px;vertical-align:middle;
  }
  .cal-legend-dot.cal-ev-vuelo{background:var(--indigo);}
  .cal-legend-dot.cal-ev-actividad{background:var(--gold);}

  /* ---------- visor de pantalla completa ---------- */
  .zoom-overlay{
    position:fixed;inset:0;background:var(--paper);z-index:1100;
    display:flex;flex-direction:column;
  }
  .zoom-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 18px 14px;color:var(--ink);font-weight:700;font-size:15px;
    border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .zoom-header button{background:none;border:none;color:var(--ink);font-size:22px;cursor:pointer;}
  .zoom-overlay .pz-frame{border-radius:0;flex:1;}
  .zoom-overlay .pz-hint{padding:8px 18px calc(8px + env(safe-area-inset-bottom));margin-top:0;}

  .inv-row{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;
    gap:10px;cursor:pointer;
  }
  .inv-nombre{font-weight:700;font-size:13.5px;}
  .inv-grupo{font-size:11.5px;color:var(--ink-dim);margin-top:1px;}
  .inv-mesa{
    font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;flex-shrink:0;
    background:var(--rose-soft);color:var(--rose);
  }
  .inv-mesa.inv-sinmesa{background:var(--line);color:var(--ink-dim);}
  .inv-check{
    width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .inv-check.on{background:var(--indigo);border-color:var(--indigo);}
  .inv-check.on::after{content:'✓';color:#fff;font-size:12px;font-weight:800;}
  .inv-row-selected{border-color:var(--indigo);background:var(--indigo-soft);}

  .xls-preview{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);}
  .xls-table{border-collapse:collapse;font-size:11px;white-space:nowrap;}
  .xls-table th, .xls-table td{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);}
  .xls-table th{background:var(--paper);color:var(--ink-dim);font-weight:700;position:sticky;top:0;}
  .xls-rownum{color:var(--ink-dim);text-align:center;background:var(--paper);}
  .xls-col-name{background:var(--rose-soft);}
  .xls-col-grupo{background:var(--gold-soft);}
  .xls-col-mesa{background:var(--sage-soft);}
  .xls-row-start td{box-shadow:inset 0 2px 0 var(--indigo), inset 0 -2px 0 var(--indigo);}

  /* ---------- bottom nav ---------- */
  nav.tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;
    background:rgba(247,242,236,.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    z-index:40;
  }
  nav.tabbar button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;
    align-items:center;gap:3px;color:var(--ink-dim);font-size:10.5px;cursor:pointer;
    padding:6px 0;font-family:inherit;
  }
  nav.tabbar button.active{color:var(--indigo);}
  nav.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}

  .fab{
    position:fixed;bottom:78px;left:50%;
    transform:translateX(calc(-50% + 200px));
    width:54px;height:54px;border-radius:50%;
    background:var(--indigo);color:#fff;border:none;
    font-size:26px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(62,76,99,.35);cursor:pointer;z-index:41;
  }
  @media (max-width:480px){
    .fab{transform:translateX(calc(-50% + 44vw));}
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(43,38,32,.45);
    display:flex;align-items:flex-end;justify-content:center;z-index:1200;
  }
  .sheet{
    background:var(--paper);width:100%;max-width:480px;
    border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
  }
  .sheet h3{font-family:ui-serif,Georgia,serif;font-size:19px;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{font-size:12px;color:var(--ink-dim);font-weight:600;display:block;margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);font-size:14.5px;color:var(--ink);font-family:inherit;
  }
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .seg button{
    flex:1;border:none;background:var(--card);padding:11px;font-size:13.5px;
    cursor:pointer;color:var(--ink-dim);font-weight:600;font-family:inherit;
  }
  .seg button.on{background:var(--indigo);color:#fff;}
  .btn-primary{
    width:100%;background:var(--indigo);color:#fff;border:none;border-radius:12px;

// Compatibilidad con datos guardados antes de que existieran los sub objetivos:
// convierte "categorias" (strings sueltos) en "subobjetivos" (objetos con id y meta propia)
// y reasigna cada gasto viejo (que tenía "categoria" como texto) a su nuevo subobjetivoId.
function migrateData(data){
  let changed = false;
  if(!data.mesas){
    data.mesas = [
      { id:'mesa-1', numero:1, nombre:'Mesa 1', asientos:10 },
      { id:'mesa-2', numero:2, nombre:'Mesa 2', asientos:10 },
      { id:'mesa-3', numero:3, nombre:'Mesa 3', asientos:10 },
      { id:'mesa-4', numero:4, nombre:'Mesa 4', asientos:10 },
      { id:'mesa-5', numero:5, nombre:'Mesa 5', asientos:10 },
      { id:'mesa-6', numero:6, nombre:'Mesa 6', asientos:10 },
    ];
    changed = true;
  }
  if(!data.invitados){ data.invitados = []; changed = true; }
  if(data.umbralMesaAlerta==null){ data.umbralMesaAlerta = 10; changed = true; }
  if(!data.luna){ data.luna = { tramos: [], actividades: [], hoteles: [] }; changed = true; }
  if(!data.luna.tramos){
    // Convertir el modelo viejo de "paradas" (llegada/salida por ciudad) al nuevo
    // modelo de "tramos" (origen -> destino), sin perder nada de lo ya cargado.
    const paradasViejas = (data.luna.paradas || []).sort((a,b)=>a.orden-b.orden);
    const tramosNuevos = [];
    for(let i=0;i<paradasViejas.length-1;i++){
      const a = paradasViejas[i], b = paradasViejas[i+1];
      tramosNuevos.push({
        id:uid(), orden:i+1, origen:a.ciudad, destino:b.ciudad,
        fechaSalida:a.fechaSalida||'', horaSalida:a.horaSalida||'',
        fechaLlegada:b.fechaLlegada||'', horaLlegada:b.horaLlegada||'',
        vuelo:a.vueloSalida||b.vueloLlegada||'',
        pasajeComprado: !!(a.pasajeSalidaComprado || b.pasajeLlegadaComprado),
        notas:a.notas||'',
        escalaTour:{tourPlaneado:false,tourComprado:false,tourPagado:false,notas:''}
      });
    }
    const actividadesViejas = [];
    paradasViejas.forEach(p=>(p.actividades||[]).forEach(act=>actividadesViejas.push({ ...act, ciudad:p.ciudad })));
    const hotelesViejos = [];
    paradasViejas.forEach(p=>{ if(p.hotel || p.hotelReservado) hotelesViejos.push({ id:uid(), ciudad:p.ciudad, hotel:p.hotel||'', reservado:!!p.hotelReservado, notas:'' }); });
    data.luna = { tramos: tramosNuevos, actividades: actividadesViejas, hoteles: hotelesViejos };
    changed = true;
  }
  if(!data.luna.actividades){ data.luna.actividades = []; changed = true; }
  if(!data.luna.hoteles){ data.luna.hoteles = []; changed = true; }
  if(!data.luna.mapaPuntos){ data.luna.mapaPuntos = []; changed = true; }
  data.luna.tramos.forEach(t=>{ if(!t.escalaTour){ t.escalaTour = {tourPlaneado:false,tourComprado:false,tourPagado:false,notas:''}; changed = true; } });
  data.luna.actividades.forEach(a=>{ if(a.horaFin==null){ a.horaFin=''; changed = true; } });
  data.objetivos.forEach(o=>{
    if(!o.subobjetivos){
      o.subobjetivos = (o.categorias||[]).map(nombre=>({id:uid(), nombre, meta:null}));
      delete o.categorias;
      changed = true;
    }
  });
  data.gastos.forEach(g=>{
    if(!g.subobjetivoId && g.categoria){
      const obj = data.objetivos.find(o=>o.id===g.objetivoId);
      if(obj){
        let so = obj.subobjetivos.find(s=>s.nombre===g.categoria);
        if(!so){ so = {id:uid(), nombre:g.categoria, meta:null}; obj.subobjetivos.push(so); }
        g.subobjetivoId = so.id;
      }
      delete g.categoria;
      changed = true;
    }
  });
  return changed;
}

function computeTotals(data){
  const totals = { total:0, novio:0, novia:0, porObjetivo:{}, porSubobjetivo:{} };
  data.objetivos.forEach(o=>{
    totals.porObjetivo[o.id] = {total:0, novio:0, novia:0};
    (o.subobjetivos||[]).forEach(s=>{ totals.porSubobjetivo[s.id] = {total:0, novio:0, novia:0}; });
  });
  data.gastos.forEach(g=>{
    totals.total += g.monto;
    totals[g.quien] = (totals[g.quien]||0) + g.monto;
    if(!totals.porObjetivo[g.objetivoId]) totals.porObjetivo[g.objetivoId] = {total:0,novio:0,novia:0};
    totals.porObjetivo[g.objetivoId].total += g.monto;
    totals.porObjetivo[g.objetivoId][g.quien] += g.monto;
    if(g.subobjetivoId){
      if(!totals.porSubobjetivo[g.subobjetivoId]) totals.porSubobjetivo[g.subobjetivoId] = {total:0,novio:0,novia:0};
      totals.porSubobjetivo[g.subobjetivoId].total += g.monto;
      totals.porSubobjetivo[g.subobjetivoId][g.quien] += g.monto;
    }
  });
  return totals;
}

/* ---------------- resumen ---------------- */
function donutSVG(pctA, pctB, colorA, colorB, size=112, stroke=12){
  const r = 50 - stroke/2;
  const c = 2*Math.PI*r;
  const lenA = c*pctA;
  const lenB = c*pctB;
  return `
  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${colorA}" stroke-width="${stroke}"
      stroke-dasharray="${lenA} ${c-lenA}" stroke-dashoffset="0" transform="rotate(-90 50 50)" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${colorB}" stroke-width="${stroke}"
      stroke-dasharray="${lenB} ${c-lenB}" stroke-dashoffset="${-lenA}" transform="rotate(-90 50 50)" stroke-linecap="round"/>
  </svg>`;
}

function exportarInvitadosExcel(){
  if(state.data.invitados.length===0){ alert('Todavía no hay invitados para exportar.'); return; }
  const mesasById = Object.fromEntries(state.data.mesas.map(m=>[m.id,m]));
  const ordenados = [...state.data.invitados].sort((a,b)=>{
    const ma = a.mesaId ? mesasById[a.mesaId] : null;
    const mb = b.mesaId ? mesasById[b.mesaId] : null;
    const na = ma ? ma.numero : 9999, nb = mb ? mb.numero : 9999;
    if(na!==nb) return na-nb;
    return a.nombre.localeCompare(b.nombre);
  });
  const filas = [['N°','Nombre','Grupo','Mesa']];
  ordenados.forEach((inv,idx)=>{
    const mesa = inv.mesaId ? mesasById[inv.mesaId] : null;
    filas.push([ idx+1, inv.nombre, inv.grupo||'', mesa ? `Mesa ${mesa.numero}` : 'Sin mesa' ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(filas);
  ws['!cols'] = [{wch:5},{wch:28},{wch:20},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Invitados');
  const fecha = todayISO();
  XLSX.writeFile(wb, `invitados_unidos_${fecha}.xlsx`);
}

async function handleExcelFile(file){
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
    if(!raw.length){ alert('El archivo está vacío.'); return; }
    openImportPreviewModal(raw);
  }catch(e){
    console.error(e);
    alert('No se pudo leer el archivo. Asegúrate de que sea un Excel (.xlsx) o CSV válido.');
  }
}

function colLetter(i){
  let s = '', n = i+1;
  while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); }
  return s;
}

function normNombre(s){
  return String(s||'')
    .trim()
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,' ');
}

function guessMesaCol(raw){
  for(let r=0;r<Math.min(8,raw.length);r++){
    for(let c=0;c<raw[r].length;c++){
      const txt = String(raw[r][c]||'').trim().toLowerCase();
      if(txt.length<=12 && /^mesas?( n°| numero| número| #)?$/.test(txt)) return c;
    }
  }
  return -1;
}

function guessNameCol(raw){
  for(let r=0;r<Math.min(8,raw.length);r++){
    for(let c=0;c<raw[r].length;c++){
      const txt = String(raw[r][c]||'').trim().toLowerCase();
      if(txt.length<=18 && /^(nombre|nombres|invitado|invitados|guest|name)s?( completo)?$/.test(txt)){
        return { col:c, headerRow:r };
      }
    }
  }
  const maxCols = Math.max(...raw.map(r=>r.length));
  let best=0, bestCount=-1;
  for(let c=0;c<maxCols;c++){
    let count=0;
    raw.forEach(r=>{ const v=r[c]; if(typeof v==='string' && v.trim().length>2 && /[a-zA-ZáéíóúñÁÉÍÓÚÑ]/.test(v) && isNaN(v)) count++; });
    if(count>bestCount){ bestCount=count; best=c; }
  }
  return { col:best, headerRow:-1 };
}

function openImportPreviewModal(raw){
  const maxCols = Math.min(12, Math.max(...raw.slice(0,25).map(r=>r.length)));
  const guess = guessNameCol(raw);
  let nameCol = guess.col;
  let grupoCol = -1;
  let mesaCol = guessMesaCol(raw);
  let startRow = guess.headerRow>=0 ? guess.headerRow+1 : 0;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
  <div class="sheet">
    <button class="close-x" id="closeSheet">✕</button>
    <h3>Importar invitados</h3>
    <p style="font-size:12.5px;color:var(--ink-dim);margin:-8px 0 14px;">Revisa la vista previa de tu archivo y confirma en qué columna están los nombres.</p>
    <div class="xls-preview" id="xlsPreview"></div>
    <div class="field-row" style="margin-top:14px;">
      <div class="field">
        <label>Columna con los nombres</label>
        <select id="pickNameCol"></select>
      </div>
      <div class="field">
        <label>Columna de grupo (opcional)</label>
        <select id="pickGrupoCol"></select>
      </div>
    </div>
    <div class="field">
      <label>Columna de mesa (opcional) <span style="font-weight:400;color:var(--ink-dim);">— si tu Excel ya trae el número de mesa, los invitados nuevos se sientan solos ahí</span></label>
      <select id="pickMesaCol"></select>
    </div>
    <div class="field">
      <label>¿En qué fila empiezan los invitados?</label>
      <input id="pickStartRow" type="number" min="1" value="${startRow+1}">
    </div>
    <label style="display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink-dim);margin:0 0 14px;cursor:pointer;">
      <input type="checkbox" id="pickOverrideMesa" style="margin-top:2px;">
      <span>Actualizar también la mesa de invitados que ya existían en la app (si no marcas esto, se conserva la mesa que ya tenían).</span>
    </label>
    <div id="importCount" style="font-size:13px;font-weight:700;margin-bottom:10px;"></div>
    <button class="btn-primary" id="doImportBtn">Importar</button>
    <button type="button" class="btn-ghost" id="cancelImportBtn">Cancelar</button>
  </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
  $('#closeSheet',overlay).onclick = ()=> overlay.remove();
  $('#cancelImportBtn',overlay).onclick = ()=> overlay.remove();

  const colOptsHtml = (selectedIdx, withNinguna)=>{
    let html = withNinguna ? `<option value="-1">Ninguna</option>` : '';
    for(let c=0;c<maxCols;c++){
      let sample = '';
      for(let r=0;r<raw.length;r++){ if(raw[r][c] && String(raw[r][c]).trim()){ sample = String(raw[r][c]).trim(); break; } }
      html += `<option value="${c}" ${c===selectedIdx?'selected':''}>${colLetter(c)}${sample?': '+sample.slice(0,16):''}</option>`;
    }
    return html;
  };
  $('#pickNameCol',overlay).innerHTML = colOptsHtml(nameCol, false);
  $('#pickGrupoCol',overlay).innerHTML = colOptsHtml(grupoCol, true);
  $('#pickMesaCol',overlay).innerHTML = colOptsHtml(mesaCol, true);

  function renderPreview(){
    const startIdx = Math.max(1, parseInt($('#pickStartRow',overlay).value)||1) - 1;
    const rows = raw.slice(0, 8);
    let html = '<table class="xls-table"><thead><tr><th></th>';
    for(let c=0;c<maxCols;c++) html += `<th class="${c===nameCol?'xls-col-name':''}${c===grupoCol?' xls-col-grupo':''}${c===mesaCol?' xls-col-mesa':''}">${colLetter(c)}</th>`;
    html += '</tr></thead><tbody>';
    rows.forEach((r,ri)=>{
      html += `<tr class="${ri===startIdx?'xls-row-start':''}"><td class="xls-rownum">${ri+1}</td>`;
      for(let c=0;c<maxCols;c++){
        html += `<td class="${c===nameCol?'xls-col-name':''}${c===grupoCol?' xls-col-grupo':''}${c===mesaCol?' xls-col-mesa':''}">${String(r[c]??'').slice(0,16)}</td>`;
      }
      html += '</tr>';
    });
    html += '</tbody></table>';
    $('#xlsPreview',overlay).innerHTML = html;
  }
  function updateCount(){
    const sr = Math.max(1, parseInt($('#pickStartRow',overlay).value)||1) - 1;
    let nuevos = 0, existentes = 0, conMesa = 0;
    const mesasFaltantes = new Set();
    for(let r=sr;r<raw.length;r++){
      const nombre = String(raw[r][nameCol]??'').trim();
      if(!nombre) continue;
      const yaExiste = state.data.invitados.some(i=>normNombre(i.nombre)===normNombre(nombre));
      if(yaExiste) existentes++; else nuevos++;
      if(mesaCol>=0){
        const num = parseInt(raw[r][mesaCol]);
        if(!isNaN(num)){
          conMesa++;
          if(!state.data.mesas.some(m=>m.numero===num)) mesasFaltantes.add(num);
        }
      }
    }
    let txt = existentes>0
      ? `${nuevos} invitado(s) nuevo(s) · ${existentes} ya existían (se actualizan sin duplicar ni mover de mesa)`
      : `Se importarán ${nuevos} invitado(s) nuevo(s).`;
    if(mesaCol>=0) txt += ` · ${conMesa} con número de mesa en el Excel`;
    if(mesasFaltantes.size) txt += ` (se crearán las mesas: ${[...mesasFaltantes].sort((a,b)=>a-b).join(', ')})`;
    $('#importCount',overlay).textContent = txt;
  }
  renderPreview(); updateCount();

  $('#pickNameCol',overlay).onchange = (e)=>{ nameCol=parseInt(e.target.value); renderPreview(); updateCount(); };
  $('#pickGrupoCol',overlay).onchange = (e)=>{ grupoCol=parseInt(e.target.value); renderPreview(); updateCount(); };
  $('#pickMesaCol',overlay).onchange = (e)=>{ mesaCol=parseInt(e.target.value); renderPreview(); updateCount(); };
  $('#pickStartRow',overlay).oninput = ()=>{ renderPreview(); updateCount(); };

  $('#doImportBtn',overlay).onclick = async ()=>{
    const sr = Math.max(1, parseInt($('#pickStartRow',overlay).value)||1) - 1;
    const forzarMesa = $('#pickOverrideMesa',overlay).checked;
    let agregados = 0, actualizados = 0, sentados = 0;
    const mesasCreadas = [];
    for(let r=sr;r<raw.length;r++){
      const nombre = String(raw[r][nameCol] ?? '').trim();
      if(!nombre) continue;
      const grupo = grupoCol>=0 ? String(raw[r][grupoCol] ?? '').trim() : '';
      let mesaIdDelExcel = null;
      if(mesaCol>=0){
        const num = parseInt(raw[r][mesaCol]);
        if(!isNaN(num)){
          let mesaEncontrada = state.data.mesas.find(m=>m.numero===num);
          if(!mesaEncontrada){
            mesaEncontrada = { id:uid(), numero:num, nombre:`Mesa ${num}`, asientos:10, tint: TINTS[(num-1+TINTS.length*100)%TINTS.length].id };
            state.data.mesas.push(mesaEncontrada);
            mesasCreadas.push(num);
          }
          mesaIdDelExcel = mesaEncontrada.id;
        }
      }
      const existente = state.data.invitados.find(i=>normNombre(i.nombre)===normNombre(nombre));
      if(existente){
        // Ya existía: actualizamos nombre/grupo por si cambiaron.
        existente.nombre = nombre;
        if(grupo) existente.grupo = grupo;
        // Si "forzarMesa" está marcado, el Excel manda siempre; si no,
        // solo se asigna mesa cuando el invitado todavía no tenía ninguna.
        if(mesaIdDelExcel && (forzarMesa || !existente.mesaId)){
          if(existente.mesaId !== mesaIdDelExcel) sentados++;
          existente.mesaId = mesaIdDelExcel;
        }
        actualizados++;
      } else {
        state.data.invitados.push({ id:uid(), nombre, grupo, mesaId:mesaIdDelExcel });
        if(mesaIdDelExcel) sentados++;
        agregados++;
      }
    }
    if(agregados===0 && actualizados===0){ alert('No se encontró ningún nombre con esa configuración. Ajusta la columna o la fila de inicio.'); return; }
    await saveShared();
    overlay.remove();
    render();

    const umbral = state.data.umbralMesaAlerta || 10;
    const excedidas = state.data.mesas
      .map(m=>({ m, n: state.data.invitados.filter(i=>i.mesaId===m.id).length }))
      .filter(x=>x.n > umbral);

    let msg = actualizados>0
      ? `${agregados} invitado(s) nuevo(s) agregados (${sentados} con mesa asignada/actualizada del Excel). ${actualizados} ya existían.`
      : `Se importaron ${agregados} invitado(s)${sentados>0?`, ${sentados} de ellos ya sentados en su mesa`:''}.`;
    if(mesasCreadas.length){
      msg += `\n\n🆕 Se crearon automáticamente estas mesas porque el Excel las mencionaba y no existían: ${mesasCreadas.join(', ')}.`;
    }
    if(excedidas.length){
      msg += `\n\n⚠️ Mesas por encima del umbral de alerta (${umbral}):\n` +
        excedidas.map(x=>`- Mesa ${x.m.numero}: ${x.n} invitados`).join('\n');
    }
    alert(msg);
  };
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shortName(nombre){
  const partes = String(nombre).trim().split(/\s+/);
  if(partes.length===1) return partes[0].slice(0,11);
  return `${partes[0]} ${partes[1][0]}.`;
}

function centerLines(texto, maxChars){
  const t = String(texto).trim();
  if(t.length<=maxChars) return [t];
  const palabras = t.split(/\s+/);
  let l1='', l2='';
  for(const w of palabras){
    if(!l2 && (l1+' '+w).trim().length<=maxChars) l1=(l1+' '+w).trim();
    else l2=(l2+' '+w).trim();
  }
  return l2 ? [l1,l2] : [l1];
}

function mesaGroupSVG(mesa, ocupantes, cx, cy, opts={}){
  const rTable = opts.rTable||62, rSeat = opts.rSeat||122;
  const seatW = opts.seatW||84, seatH = opts.seatH||32;
  const fontSize = opts.fontSize||10.5;
  const nameFont = opts.nameFont || Math.round(rTable*0.28);
  const compacto = !!opts.compacto;
  const umbral = state.data.umbralMesaAlerta || 10;
  const excedida = ocupantes.length > umbral;
  const colorMesa = excedida ? 'var(--danger)' : 'var(--indigo)';
  const n = Math.max(mesa.asientos, ocupantes.length, umbral);
  let seatEls = '';
  for(let i=0;i<n;i++){
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const sx = cx + rSeat*Math.cos(angle);
    const sy = cy + rSeat*Math.sin(angle);
    const guest = ocupantes[i];
    const fill = guest ? (excedida ? '#F3DAD6' : 'var(--rose-soft)') : 'var(--card)';
    const stroke = guest ? (excedida ? 'var(--danger)' : 'var(--rose)') : 'var(--line)';
    const txtColor = guest ? 'var(--ink)' : 'var(--ink-dim)';
    const label = guest ? escapeHtml(shortName(guest.nombre)) : (compacto ? `${i+1}` : `Asiento ${i+1}`);
    seatEls += `<g class="${guest?'seat-occupied':'seat-empty'}" data-seatinv="${guest?guest.id:''}" style="cursor:pointer;">
      <rect x="${(sx-seatW/2).toFixed(1)}" y="${(sy-seatH/2).toFixed(1)}" width="${seatW}" height="${seatH}" rx="7" style="fill:${fill};stroke:${stroke};stroke-width:1.3;"/>
      <text x="${sx.toFixed(1)}" y="${(sy+fontSize*0.35).toFixed(1)}" text-anchor="middle" font-size="${fontSize}" font-weight="${guest?'700':'400'}" style="fill:${txtColor};">${label}</text>
    </g>`;
  }
  const lineas = centerLines(mesa.nombre, Math.max(6, Math.round(rTable/8)));
  const countFont = Math.max(8, Math.round(nameFont*0.55));
  const countTxt = `${ocupantes.length}/${mesa.asientos}`;
  let nameEls;
  if(lineas.length===1){
    nameEls = `<text x="${cx}" y="${(cy-nameFont*0.15).toFixed(1)}" text-anchor="middle" font-size="${nameFont}" font-weight="800" style="fill:#fff;">${escapeHtml(lineas[0])}</text>
       <text x="${cx}" y="${(cy+nameFont*0.75).toFixed(1)}" text-anchor="middle" font-size="${countFont}" font-weight="600" style="fill:#fff;opacity:.85;">${countTxt}</text>`;
  } else {
    nameEls = `<text x="${cx}" y="${(cy-nameFont*0.9).toFixed(1)}" text-anchor="middle" font-size="${nameFont}" font-weight="800" style="fill:#fff;">${escapeHtml(lineas[0])}</text>
       <text x="${cx}" y="${(cy+nameFont*0.15).toFixed(1)}" text-anchor="middle" font-size="${nameFont}" font-weight="800" style="fill:#fff;">${escapeHtml(lineas[1])}</text>
       <text x="${cx}" y="${(cy+nameFont*1.15).toFixed(1)}" text-anchor="middle" font-size="${countFont}" font-weight="600" style="fill:#fff;opacity:.85;">${countTxt}</text>`;
  }
  return `
    <circle cx="${cx}" cy="${cy}" r="${rTable}" style="fill:${colorMesa};"/>
    ${nameEls}
    ${seatEls}`;
}

function mesaSVG(mesa, ocupantes){
  const size = 320, cx = size/2, cy = size/2;
  return `<svg viewBox="0 0 ${size} ${size}" style="display:block;">
    ${mesaGroupSVG(mesa, ocupantes, cx, cy, {rTable:62, rSeat:122, seatW:84, seatH:32, fontSize:10.5, nameFont:19})}
  </svg>`;
}

function floorPlanDims(){
  const extras = state.data.mesas.filter(m=>![1,2,3,4,5,6].includes(m.numero));
  const numColsExtra = Math.max(0, Math.ceil(extras.length/3));
  const estX = 760;
  const minX = numColsExtra>0 ? (150 - 280*numColsExtra) - 140 : 0;
  const width = (estX + 100) - minX;
  return { width, height: 800, minX };
}

function floorPlanSVG(){
  const filaY = [140, 400, 660];
  const colX = i => 150 + i*280;
  const principales = { 4:[0,0], 1:[1,0], 5:[0,1], 2:[1,1], 6:[0,2], 3:[1,2] }; // numero -> [columna, fila]
  const opts = {rTable:56, rSeat:98, seatW:56, seatH:21, fontSize:8, nameFont:15, compacto:true};
  let contenido = '';

  Object.entries(principales).forEach(([num, [colI,rowI]])=>{
    const m = state.data.mesas.find(x=>x.numero===Number(num));
    if(!m) return;
    const ocupantes = state.data.invitados.filter(i=>i.mesaId===m.id);
    contenido += `<g data-mesaopen="${m.id}" style="cursor:pointer;">
      ${mesaGroupSVG(m, ocupantes, colX(colI), filaY[rowI], opts)}
    </g>`;
  });

  // Novios y Estrado quedan siempre en el mismo lugar, sin importar cuántas
  // mesas extra haya.
  const novX = 650, novY = 400;
  const nombreNovia = escapeHtml(shortName(state.data.parejaNombres.novia||'Novia'));
  const nombreNovio = escapeHtml(shortName(state.data.parejaNombres.novio||'Novio'));
  contenido += `<g>
    <text x="${novX}" y="${novY-70}" text-anchor="middle" font-size="13" font-weight="800" style="fill:var(--ink);">NOVIOS</text>
    <rect x="${novX-40}" y="${novY-55}" width="80" height="110" rx="16" style="fill:var(--rose-soft);stroke:var(--rose);stroke-width:1.5;"/>
    <rect x="${novX-28}" y="${novY-35}" width="56" height="22" rx="6" style="fill:var(--card);stroke:var(--rose);stroke-width:1.2;"/>
    <text x="${novX}" y="${novY-35+15}" text-anchor="middle" font-size="9.5" font-weight="700" style="fill:var(--ink);">${nombreNovia}</text>
    <rect x="${novX-28}" y="${novY+13}" width="56" height="22" rx="6" style="fill:var(--card);stroke:var(--rose);stroke-width:1.2;"/>
    <text x="${novX}" y="${novY+13+15}" text-anchor="middle" font-size="9.5" font-weight="700" style="fill:var(--ink);">${nombreNovio}</text>
  </g>`;

  const estX = novX + 110, estY = 400;
  contenido += `<g>
    <rect x="${estX-35}" y="${estY-190}" width="70" height="380" rx="18" style="fill:var(--indigo);"/>
    <text x="0" y="0" text-anchor="middle" font-size="13" font-weight="800" style="fill:#fff;" transform="translate(${estX} ${estY}) rotate(-90)">ESTRADO</text>
  </g>`;

  // Cualquier mesa que no sea la 1-6 (por ejemplo la 7, 8...) se ubica
  // automáticamente en columna(s) nuevas A LA IZQUIERDA de la Mesa 4/5/6,
  // sin mover nunca a la 1-6, a Novios ni al Estrado de su lugar.
  const extras = state.data.mesas
    .filter(m=>![1,2,3,4,5,6].includes(m.numero))
    .sort((a,b)=>a.numero-b.numero);
  extras.forEach((m,idx)=>{
    const colI = Math.floor(idx/3); // 0 = columna más cercana a la Mesa 4, luego se aleja
    const rowI = idx % 3;
    const cx = 150 - 280*(colI+1);
    const ocupantes = state.data.invitados.filter(i=>i.mesaId===m.id);
    contenido += `<g data-mesaopen="${m.id}" style="cursor:pointer;">
      ${mesaGroupSVG(m, ocupantes, cx, filaY[rowI], opts)}
    </g>`;
  });

  const dims = floorPlanDims();
  return `<svg viewBox="${dims.minX} 0 ${dims.width} ${dims.height}" style="display:block;">${contenido}</svg>`;
}

function initPinchZoomScale(frameEl, opts={}){
  if(!frameEl || frameEl.__pzScaleInit) return;
  frameEl.__pzScaleInit = true;
  const min = opts.min || 0.6, max = opts.max || 3;
  let scale = 1, startDist = 0, startScale = 1, lastTap = 0;
  const dist = (t1,t2)=> Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY);
  frameEl.style.setProperty('--cal-scale', scale);

  frameEl.addEventListener('touchstart',(e)=>{
    if(e.touches.length===2){ startDist = dist(e.touches[0],e.touches[1]); startScale = scale; }
  }, {passive:true});

  frameEl.addEventListener('touchmove',(e)=>{
    if(e.touches.length===2 && startDist){
      e.preventDefault();
      const d = dist(e.touches[0],e.touches[1]);
      scale = Math.min(max, Math.max(min, startScale * (d/startDist)));
      frameEl.style.setProperty('--cal-scale', scale);
    }
  }, {passive:false});

  frameEl.addEventListener('touchend',(e)=>{
    if(e.touches.length<2) startDist = 0;
    if(e.touches.length===0){
      const now = Date.now();
      if(now-lastTap<300){ scale = 1; frameEl.style.setProperty('--cal-scale', scale); }
      lastTap = now;
    }
  });
}

function initPinchZoom(frameEl){
  if(!frameEl || frameEl.__pzInit) return;
  frameEl.__pzInit = true;
  const svg = frameEl.querySelector('svg');
  if(!svg || !svg.viewBox || !svg.viewBox.baseVal) return;

  const x0 = svg.viewBox.baseVal.x, y0 = svg.viewBox.baseVal.y;
  const w0 = svg.viewBox.baseVal.width, h0 = svg.viewBox.baseVal.height;
  let scale = 1; // 1 = vista completa; más alto = más acercado
  let cx = x0 + w0/2, cy = y0 + h0/2; // centro actual, en coordenadas del dibujo

  function apply(){
    scale = Math.min(4, Math.max(1, scale));
    const w = w0/scale, h = h0/scale;
    let vx = cx - w/2, vy = cy - h/2;
    vx = Math.min(x0 + w0 - w, Math.max(x0, vx));
    vy = Math.min(y0 + h0 - h, Math.max(y0, vy));
    cx = vx + w/2; cy = vy + h/2;
    svg.setAttribute('viewBox', `${vx} ${vy} ${w} ${h}`);
  }

  let startDist=0, startScale=1;
  let panStart=null, panOriginCx=0, panOriginCy=0;
  let lastTap=0;
  const dist = (t1,t2)=> Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY);

  function pxToViewBox(dxPx, dyPx){
    const rect = frameEl.getBoundingClientRect();
    const w = w0/scale, h = h0/scale;
    return { dx: dxPx*(w/rect.width), dy: dyPx*(h/rect.height) };
  }

  frameEl.addEventListener('touchstart',(e)=>{
    if(e.touches.length===2){
      startDist = dist(e.touches[0],e.touches[1]);
      startScale = scale;
      panStart = null;
    } else if(e.touches.length===1 && scale>1){
      panStart = {x:e.touches[0].clientX, y:e.touches[0].clientY};
      panOriginCx = cx; panOriginCy = cy;
    }
  }, {passive:true});

  frameEl.addEventListener('touchmove',(e)=>{
    if(e.touches.length===2 && startDist){
      e.preventDefault();
      const d = dist(e.touches[0],e.touches[1]);
      scale = Math.min(4, Math.max(1, startScale * (d/startDist)));
      apply();
    } else if(e.touches.length===1 && panStart){
      e.preventDefault();
      const dxPx = e.touches[0].clientX - panStart.x;
      const dyPx = e.touches[0].clientY - panStart.y;
      const {dx,dy} = pxToViewBox(dxPx, dyPx);
      cx = panOriginCx - dx;
      cy = panOriginCy - dy;
      apply();
    }
  }, {passive:false});

  frameEl.addEventListener('touchend',(e)=>{
    if(e.touches.length<2) startDist=0;
    if(e.touches.length===0){
      panStart=null;
      const now = Date.now();
      if(now-lastTap<300){ scale=1; cx=x0+w0/2; cy=y0+h0/2; apply(); }
      lastTap = now;
    }
  });
}

function openMesaModal(mesaId){
  const m = state.data.mesas.find(x=>x.id===mesaId);
  const ocupantes = state.data.invitados.filter(i=>i.mesaId===m.id);
  const disponibles = state.data.invitados.filter(i=>!i.mesaId);
  const umbral = state.data.umbralMesaAlerta || 10;
  const excedida = ocupantes.length > umbral;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
  <div class="sheet">
    <button class="close-x" id="closeSheet">✕</button>
    <h3>Mesa ${m.numero}</h3>
    ${excedida ? `<p style="background:#F3DAD6;color:var(--danger);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;margin:-6px 0 14px;">⚠️ Esta mesa tiene ${ocupantes.length} invitados, por encima del umbral de alerta (${umbral}).</p>` : ''}
    <div class="field-row">
      <div class="field">
        <label>Nombre de la mesa</label>
        <input id="mNombre" value="${m.nombre}">
      </div>
      <div class="field" style="max-width:110px;">
        <label>Asientos</label>
        <input id="mAsientos" type="number" min="1" value="${m.asientos}">
      </div>
    </div>
    <button class="btn-ghost" id="saveMesaBtn" style="margin-top:0;">Guardar cambios de la mesa</button>

    <div class="mesa-svg-wrap">
      <button class="fs-btn" id="mesaModalFsBtn" aria-label="Ver en pantalla completa">⛶</button>
      <div class="pz-frame" id="mesaModalFrame" style="aspect-ratio:1/1;">
        <div class="pz-inner">${mesaSVG(m, ocupantes)}</div>
      </div>
      <p class="pz-hint">Pellizca para hacer zoom · arrastra para moverte · doble toque para restablecer</p>
    </div>
    <p style="text-align:center;font-size:11px;color:var(--ink-dim);margin:8px 0 0;">Toca un asiento ocupado para quitar a esa persona.</p>

    <div class="field" style="margin-top:18px;">
      <label>Sentados aquí (${ocupantes.length}/${m.asientos})</label>
      <div id="ocupantesList">
        ${ocupantes.length ? ocupantes.map(i=>`
          <div class="inv-row" style="cursor:default;">
            <div class="inv-mid"><div class="inv-nombre">${i.nombre}</div>${i.grupo?`<div class="inv-grupo">${i.grupo}</div>`:''}</div>
            <button class="gasto-del" data-quitar="${i.id}">Quitar</button>
          </div>`).join('') : `<div class="empty" style="padding:16px;">Nadie sentado todavía en esta mesa.</div>`}
      </div>
    </div>

    <div class="field">
      <label>Agregar invitado a esta mesa</label>
      <select id="addInvSelect">
        <option value="">Elige un invitado sin mesa...</option>
        ${disponibles.map(i=>`<option value="${i.id}">${i.nombre}</option>`).join('')}
      </select>
      <button class="btn-primary" id="addInvBtn" style="margin-top:10px;">Sentar en esta mesa</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
  $('#closeSheet',overlay).onclick = ()=> overlay.remove();
  initPinchZoom($('#mesaModalFrame',overlay));
  $('#mesaModalFsBtn',overlay).onclick = ()=> openMesaFullscreen(mesaId);

  $$('.seat-occupied',overlay).forEach(seat=>{
    seat.onclick = async ()=>{
      const invId = seat.getAttribute('data-seatinv');
      const inv = state.data.invitados.find(i=>i.id===invId);
      if(!inv) return;
      if(confirm(`¿Quitar a ${inv.nombre} de esta mesa?`)){
        inv.mesaId = null;
        await saveShared();
        render();
        overlay.remove();
        openMesaModal(mesaId);
      }
    };
  });
  $$('.seat-empty',overlay).forEach(seat=>{
    seat.onclick = ()=>{
      const sel = $('#addInvSelect',overlay);
      sel.focus();
      sel.scrollIntoView({block:'center', behavior:'smooth'});
    };
  });

  $('#saveMesaBtn',overlay).onclick = async ()=>{
    const nombre = $('#mNombre',overlay).value.trim() || m.nombre;
    const asientos = parseInt($('#mAsientos',overlay).value) || m.asientos;
    m.nombre = nombre; m.asientos = asientos;
    await saveShared();
    overlay.remove();
    render();
    openMesaModal(mesaId);
  };

  $('#addInvBtn',overlay).onclick = async ()=>{
    const invId = $('#addInvSelect',overlay).value;
    if(!invId) return;
    const inv = state.data.invitados.find(i=>i.id===invId);
    if(!inv) return;
    if(ocupantes.length >= m.asientos){
      if(!confirm(`Esta mesa ya tiene ${ocupantes.length} de ${m.asientos} asientos ocupados. ¿Igual quieres sentar a ${inv.nombre} aquí? Puedes ampliar los asientos arriba si prefieres.`)) return;
    }
    inv.mesaId = m.id;
    await saveShared();
    overlay.remove();
    render();
    openMesaModal(mesaId);
  };

  $$('[data-quitar]',overlay).forEach(b=>{
    b.onclick = async ()=>{
      const inv = state.data.invitados.find(i=>i.id===b.getAttribute('data-quitar'));
      if(inv){ inv.mesaId = null; await saveShared(); render(); overlay.remove(); openMesaModal(mesaId); }
    };
  });
}

/* ---------------- luna de miel ---------------- */
function fmtFechaLarga(fecha){
  if(!fecha) return '';
  try{
    return new Date(fecha+'T00:00:00').toLocaleDateString('es-PE',{weekday:'long', day:'2-digit', month:'long'});
  }catch(e){ return fecha; }
}
function horasEntre(fecha1,hora1,fecha2,hora2){
  if(!fecha1||!hora1||!fecha2||!hora2) return null;
  try{
    const d1 = new Date(`${fecha1}T${hora1}`);
    const d2 = new Date(`${fecha2}T${hora2}`);
    const h = (d2-d1)/3600000;
    return isNaN(h) ? null : h;
  }catch(e){ return null; }
}
function fmtHoras(h){
  const horas = Math.floor(Math.abs(h));
  const mins = Math.round((Math.abs(h)-horas)*60);
  return mins>0 ? `${horas}h ${mins}min` : `${horas}h`;
}

}

function ciudadesDelViaje(){
  const set = new Set();
  state.data.luna.tramos.forEach(t=>{ if(t.origen) set.add(t.origen); if(t.destino) set.add(t.destino); });
  return [...set];
}

function horaATexto(dec){
  const h = Math.floor(dec)%24;
  const m = Math.round((dec-Math.floor(dec))*60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function calendarioEventos(){
  const eventos = [];
  const fechas = new Set();

  state.data.luna.tramos.forEach(t=>{
    if(!t.fechaSalida || !t.horaSalida) return;
    const [hS,mS] = t.horaSalida.split(':').map(Number);
    const horaIni = hS + mS/60;
    const label = `✈ ${t.origen}→${t.destino}`;
    if(t.fechaLlegada && t.horaLlegada && t.fechaLlegada !== t.fechaSalida){
      eventos.push({ fecha:t.fechaSalida, horaIni, horaFin:24, label, tipo:'vuelo' });
      const [hL,mL] = t.horaLlegada.split(':').map(Number);
      eventos.push({ fecha:t.fechaLlegada, horaIni:0, horaFin:Math.max(0.5,hL+mL/60), label, tipo:'vuelo' });
      fechas.add(t.fechaSalida); fechas.add(t.fechaLlegada);
    } else {
      let horaFin = horaIni + 1;
      if(t.horaLlegada){
        const [hL,mL] = t.horaLlegada.split(':').map(Number);
        const hf = hL + mL/60;
        if(hf>horaIni) horaFin = hf;
      }
      eventos.push({ fecha:t.fechaSalida, horaIni, horaFin:Math.min(24,horaFin), label, tipo:'vuelo' });
      fechas.add(t.fechaSalida);
    }
  });

  state.data.luna.actividades.forEach(a=>{
    if(!a.fecha) return;
    let horaIni = 0;
    if(a.hora){ const [h,m]=a.hora.split(':').map(Number); horaIni = h+m/60; }
    let horaFin = horaIni + 1;
    if(a.horaFin){ const [h2,m2]=a.horaFin.split(':').map(Number); const hf=h2+m2/60; if(hf>horaIni) horaFin = hf; }
    eventos.push({ fecha:a.fecha, horaIni, horaFin:Math.min(24,horaFin), label:`🎟 ${a.titulo}`, tipo:'actividad' });
    fechas.add(a.fecha);
  });

  return { eventos, fechas:[...fechas].sort() };
}

function rangoFechasCompleto(fechas){
  if(fechas.length===0) return [];
  const out = [];
  let d = new Date(fechas[0]+'T00:00:00');
  const dMax = new Date(fechas[fechas.length-1]+'T00:00:00');
  while(d<=dMax){
    out.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate()+1);
  }
  return out;
}

function hora12(h){
  const periodo = h<12 ? 'AM' : 'PM';
  let h12 = h%12; if(h12===0) h12=12;
  return `${h12}:00 ${periodo}`;
}
function hora12Texto(hhmm){
  if(!hhmm) return '';
  const partes = hhmm.split(':');
  const h = parseInt(partes[0],10);
  const m = partes[1] || '00';
  if(isNaN(h)) return hhmm;
  const periodo = h<12 ? 'AM' : 'PM';
  let h12 = h%12; if(h12===0) h12=12;
  return `${String(h12).padStart(2,'0')}:${m} ${periodo}`;
}

function calendarioTablaHTML(){
  const { eventos, fechas } = calendarioEventos();
  if(fechas.length===0) return null;
  const dias = rangoFechasCompleto(fechas);

  // matriz[fecha][hora] = {estado:'libre'|'consumido'|'evento', rowspan, eventos:[]}
  const matriz = {};
  dias.forEach(f=>{ matriz[f] = Array.from({length:24}, ()=>({estado:'libre'})); });
  [...eventos].sort((a,b)=>a.horaIni-b.horaIni).forEach(ev=>{
    if(!matriz[ev.fecha]) return;
    const startHour = Math.max(0, Math.min(23, Math.floor(ev.horaIni)));
    const endExcl = Math.max(startHour+1, Math.min(24, Math.ceil(ev.horaFin)));
    const rowspan = endExcl - startHour;
    const celda = matriz[ev.fecha][startHour];
    if(celda.estado==='libre'){
      celda.estado = 'evento';
      celda.rowspan = rowspan;
      celda.eventos = [ev];
      for(let h=startHour+1; h<startHour+rowspan && h<24; h++){ matriz[ev.fecha][h] = {estado:'consumido'}; }
    } else if(celda.estado==='evento'){
      celda.eventos.push(ev);
      celda.rowspan = Math.max(celda.rowspan, rowspan);
      for(let h=startHour+1; h<startHour+celda.rowspan && h<24; h++){
        if(!matriz[ev.fecha][h] || matriz[ev.fecha][h].estado==='libre') matriz[ev.fecha][h] = {estado:'consumido'};
      }
    }
  });

  let thead = `<tr><th class="cal-esquina"></th>${dias.map(f=>`<th>${fmtDate(f)}</th>`).join('')}</tr>`;
  let filas = '';
  for(let h=0; h<24; h++){
    let fila = `<tr><td class="cal-hora">${hora12(h)}</td>`;
    dias.forEach(f=>{
      const c = matriz[f][h];
      if(c.estado==='consumido') return; // ya cubierta por un rowspan de una fila anterior
      if(c.estado==='evento'){
        const clases = c.eventos.map(e=>`cal-ev-${e.tipo}`).join(' ');
        const contenido = c.eventos.map(e=>`<div class="cal-ev-label">${e.label}</div>`).join('');
        fila += `<td class="cal-evento ${clases}" rowspan="${c.rowspan}">${contenido}</td>`;
      } else {
        fila += `<td class="cal-vacio"></td>`;
      }
    });
    fila += '</tr>';
    filas += fila;
  }

  return `<table class="cal-tabla"><thead>${thead}</thead><tbody>${filas}</tbody></table>`;
}

function itinerarioLunaView(){
  const tramos = [...state.data.luna.tramos].sort((a,b)=>a.orden-b.orden);
  if(tramos.length===0){
    return `<div class="empty">Todavía no hay tramos en el itinerario. Toca "+" para agregar el primero (por ejemplo, Lima → Panamá).</div>
    <button class="btn-ghost" id="newTramoBtn">+ Agregar tramo</button>`;
  }

  let html = tramos.map((t,idx)=>{
    const tramoHTML = `
    <div class="luna-card" data-tramoopen="${t.id}">
      <div class="luna-card-head">
        <span class="luna-ciudad">${t.origen} → ${t.destino}</span>
      </div>
      <div class="luna-fila"><span>📅 Sale: ${t.fechaSalida?fmtDate(t.fechaSalida):'sin fecha'}${t.horaSalida?' · '+hora12Texto(t.horaSalida):''}</span></div>
      <div class="luna-fila"><span>🛬 Llega: ${t.fechaLlegada?fmtDate(t.fechaLlegada):'sin fecha'}${t.horaLlegada?' · '+hora12Texto(t.horaLlegada):''}</span></div>
      ${t.vuelo ? `<div class="luna-fila"><span>✈️ ${t.vuelo}</span></div>` : ''}
      <div class="luna-fila">${chipEstado(t.pasajeComprado,'Pasaje comprado','Pasaje pendiente')}</div>
      ${t.notas ? `<div class="luna-notas">${t.notas}</div>` : ''}
    </div>`;

    // ¿Hay una escala con el siguiente tramo en la misma ciudad de conexión?
    let escalaHTML = '';
    const next = tramos[idx+1];
    if(next && t.destino === next.origen){
      const gap = horasEntre(t.fechaLlegada, t.horaLlegada, next.fechaSalida, next.horaSalida);
      if(gap!=null && gap>=2 && gap<=30){
        const et = t.escalaTour;
        escalaHTML = `
        <div class="luna-escala">
          <div class="luna-escala-head">⏱ Escala de ${fmtHoras(gap)} en ${t.destino} — ¿aprovechan para un tour?</div>
          <label class="luna-escala-check"><input type="checkbox" data-escala="${t.id}" data-campo="tourPlaneado" ${et.tourPlaneado?'checked':''}> Van a hacer un tour</label>
          ${et.tourPlaneado ? `
            <label class="luna-escala-check"><input type="checkbox" data-escala="${t.id}" data-campo="tourComprado" ${et.tourComprado?'checked':''}> Tour comprado</label>
            <label class="luna-escala-check"><input type="checkbox" data-escala="${t.id}" data-campo="tourPagado" ${et.tourPagado?'checked':''}> Tour pagado</label>
            <input type="text" class="luna-escala-notas" data-escalanotas="${t.id}" value="${(et.notas||'').replace(/"/g,'&quot;')}" placeholder="Nombre del tour, notas...">
          ` : ''}
        </div>`;
      } else if(gap!=null && gap>0 && gap<2){
        escalaHTML = `<div class="luna-escala luna-escala-ajustada">⚠️ Conexión ajustada de ${fmtHoras(gap)} en ${t.destino} — poco tiempo para un tour.</div>`;
      }
    }
    return tramoHTML + escalaHTML;
  }).join('');

  return `
  <div class="luna-timeline">${html}</div>
  <button class="btn-ghost" id="newTramoBtn">+ Agregar tramo</button>

  <div class="section-head" style="margin-top:26px;"><h2>Alojamiento</h2></div>
  ${hotelesLunaHTML()}
  `;
}

function hotelesLunaHTML(){

  const hoteles = state.data.luna.hoteles;
  if(ciudades.length===0) return `<div class="empty">Agrega tramos primero para poder anotar el hotel de cada ciudad.</div>`;
  return ciudades.map(ciudad=>{
    const h = hoteles.find(x=>x.ciudad===ciudad);
    return `
    <div class="luna-hotel-row" data-hotelciudad="${ciudad}">
      <div class="luna-hotel-mid">

        <div class="luna-hotel-nombre">${h && h.hotel ? h.hotel : 'Sin hotel anotado todavía'}</div>
      </div>
      ${chipEstado(h && h.reservado, 'Reservado', 'Sin reservar')}
    </div>`;
  }).join('');
}

  const grupos = {};

  });

  const cuerpo = Object.keys(grupos).length===0
    ? `<div class="empty">Todavía no hay actividades planeadas${filtro!=='todas'?' para esta ciudad':''}. Toca "+" para agregar la primera.</div>`
    : Object.entries(grupos).map(([fecha, acts])=>`
      <div class="luna-dia-grupo">
        <div class="luna-dia-header">${fecha==='Sin fecha' ? 'Sin fecha asignada' : fmtFechaLarga(fecha)}</div>
        ${acts.map(a=>`
          <div class="luna-act-row ${a.hecho?'luna-act-hecho':''}" data-actopen="${a.id}">
            <div class="luna-act-mid">

function verPuntoEnMapa(puntoId){
  const p = state.data.luna.mapaPuntos.find(x=>x.id===puntoId);
  if(!p || !_lunaMap) return;
  _lunaMap.setView([p.lat, p.lng], 16);
  const marker = _lunaMapMarkers.find(m=>{
    const ll = m.getLatLng();
    return Math.abs(ll.lat-p.lat)<1e-9 && Math.abs(ll.lng-p.lng)<1e-9;
  });
  if(marker) marker.openTooltip();
  const el = document.getElementById('lunaMapa');
  if(el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}

let _lunaMapFs = null;
function openMapaFullscreen(){
  if(!_lunaMap) return;
  const overlay = document.createElement('div');
  overlay.className = 'zoom-overlay';
  overlay.innerHTML = `
    <div class="zoom-header">
      <span>Mapa del viaje</span>
      <button id="zoomCloseBtn">✕</button>
    </div>
    <div id="lunaMapaFs" style="flex:1;"></div>
  `;
  document.body.appendChild(overlay);
  $('#zoomCloseBtn',overlay).onclick = ()=>{
    if(_lunaMapFs){ _lunaMapFs.remove(); _lunaMapFs = null; }
    overlay.remove();
  };

  const el = document.getElementById('lunaMapaFs');
  const puntos = state.data.luna.mapaPuntos;
  _lunaMapFs = L.map(el).setView(_lunaMap.getCenter(), _lunaMap.getZoom());
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 19
  }).addTo(_lunaMapFs);
  puntos.forEach(p=>{
    const marker = L.marker([p.lat, p.lng]).addTo(_lunaMapFs);
    marker.bindTooltip(p.nombre);
    marker.on('click', ()=> openMapaPuntoModal(p.id));
  });
  _lunaMapFs.on('click', (e)=> openMapaPuntoModal(null, e.latlng.lat, e.latlng.lng));
  setTimeout(()=>{ if(_lunaMapFs) _lunaMapFs.invalidateSize(); }, 200);
}

function initLunaMapa(){
  const el = document.getElementById('lunaMapa');
  if(!el || typeof L === 'undefined') return;
  if(_lunaMap){ _lunaMap.remove(); _lunaMap = null; _lunaMapMarkers = []; }
  _lunaMyLocMarker = null;
  _lunaBusquedaMarker = null;

  const puntos = state.data.luna.mapaPuntos;
  const centro = puntos.length ? [puntos[0].lat, puntos[0].lng] : [4.5, -74];
  _lunaMap = L.map(el).setView(centro, puntos.length ? 6 : 3);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19
  }).addTo(_lunaMap);

  puntos.forEach(p=>{
    const marker = L.marker([p.lat, p.lng]).addTo(_lunaMap);
    marker.bindTooltip(p.nombre);
    marker.on('click', ()=> openMapaPuntoModal(p.id));
    _lunaMapMarkers.push(marker);
  });
  if(puntos.length>1){
    _lunaMap.fitBounds(L.latLngBounds(puntos.map(p=>[p.lat,p.lng])), {padding:[30,30]});
  }
  _lunaMap.on('click', (e)=> openMapaPuntoModal(null, e.latlng.lat, e.latlng.lng));

  setTimeout(()=>{ if(_lunaMap) _lunaMap.invalidateSize(); }, 200);
}

async function buscarLugarMapa(){
  const q = $('#lunaMapaBuscar').value.trim();
  if(!q) return;
  const btn = $('#lunaMapaBuscarBtn');
  btn.textContent = 'Buscando...';
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if(data && data[0] && _lunaMap){
      const lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
      _lunaMap.setView([lat, lon], 15);
      if(_lunaBusquedaMarker) _lunaMap.removeLayer(_lunaBusquedaMarker);
      _lunaBusquedaMarker = L.marker([lat, lon]).addTo(_lunaMap);
      openMapaPuntoModal(null, lat, lon, q, data[0].display_name);
    } else {
      alert('No se encontró ese lugar. Prueba con otro nombre o dirección.');
    }
  }catch(e){
    alert('No se pudo buscar. Revisa tu conexión a internet.');
  }
  btn.textContent = 'Buscar';
}

let _lunaBusquedaMarker = null;
let _lunaMyLocMarker = null;
function irAMiUbicacion(){
  if(!navigator.geolocation){
    alert('Tu navegador no permite compartir ubicación.');
    return;
  }
  const btn = $('#lunaMapaUbicacionBtn');
  if(btn) btn.textContent = '…';
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      if(btn) btn.textContent = '📍';
      if(!_lunaMap) return;
      const { latitude, longitude } = pos.coords;
      _lunaMap.setView([latitude, longitude], 14);
      if(_lunaMyLocMarker) _lunaMap.removeLayer(_lunaMyLocMarker);
      _lunaMyLocMarker = L.circleMarker([latitude, longitude], {
        radius: 8, color: '#fff', weight: 3, fillColor: '#3B82F6', fillOpacity: 1
      }).addTo(_lunaMap).bindTooltip('Estás aquí');
    },
    (err)=>{
      if(btn) btn.textContent = '📍';
      if(err.code === err.PERMISSION_DENIED){
        alert('No diste permiso de ubicación. Revisa los permisos del sitio en la configuración de tu navegador/celular y vuelve a intentar.');
      } else {
        alert('No se pudo obtener tu ubicación. Revisa que el GPS/ubicación esté activado.');
      }
    },
    { enableHighAccuracy:true, timeout:10000 }
  );
}
